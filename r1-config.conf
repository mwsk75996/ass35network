forwarding-options {
    port-mirroring {
        input {
            rate 1;
        }
        family inet {
            output {
                interface ge-0/0/4.0 {
                    next-hop 2.2.2.1;
                }
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.56.16.1;
    }
}
security {
    nat {
        source {
            rule-set soho {
                from zone [ DMZ USERLAN ];
                to zone untrust;
                rule hide-inside {
                    match {
                        source-address 0.0.0.0/0;
                    }
                    then {
                        source-nat {
                            interface;
                        }
                    }
                }
            }
        }
        destination {
            pool webserver-pool {
                address 192.168.4.10/32;
            }
            rule-set from-lablan {
                from zone untrust;
                rule to-web {
                    match {
                        destination-address 10.56.16.85/32;
                        destination-port 80;
                    }
                    then {
                        destination-nat {
                            pool {
                                webserver-pool;
                            }
                        }
                    }
                }
            }
        }
    }
    policies {
        from-zone USERLAN to-zone untrust {
            policy permit-internet {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone USERLAN to-zone DMZ {
            policy permit-web {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone untrust to-zone DMZ {
            policy permit-web-dnat {
                match {
                    source-address any;
                    destination-address webserver;
                    application junos-http;
                }
                then {
                    permit;
                }
            }
        }
    }
    zones {
        security-zone USERLAN {
            host-inbound-traffic {
                system-services {
                    all;
                }
            }
            interfaces {
                ge-0/0/1.0;
            }
        }
        security-zone DMZ {
            address-book {
                address webserver 192.168.4.10/32;
            }
            host-inbound-traffic {
                system-services {
                    ping;
                }
            }
            interfaces {
                ge-0/0/2.0;
            }
        }
        security-zone untrust {
            host-inbound-traffic {
                system-services {
                    ping;
                }
            }
            interfaces {
                ge-0/0/3.0;
            }
        }
        security-zone MONITOR {
            host-inbound-traffic {
                system-services {
                    ping;
                }
            }
            interfaces {
                ge-0/0/4.0;
            }
        }
    }
}
firewall {
    filter my-port-filter {
        term myMirrorTerm {
            from {
                source-address {
                    0.0.0.0/0;
                }
            }
            then {
                count mirror-count;
                port-mirror;
                accept;
            }
        }
    }
}
vlans {
    mySwitch1Vlan {
        vlan-id 4;
    }
    mySwitch2Vlan {
        vlan-id 3;
    }
}
